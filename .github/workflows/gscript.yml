name: Auto Comment on Issue and PR

on:
  issues:
    types: [opened, reopened, closed]
  pull_request:
    types: [opened]

jobs:
  # 处理 issue 的标签和评论
  label_issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    if: github.event.action == 'opened' || github.event.action == 'reopened'
    steps:
      - name: Attach labels to issue
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ["issue", "fix"]
            })
      - name: Comment on new issue
        uses: peter-evans/create-or-update-comment@v1
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            Thanks for opening this issue! We'll take a look as soon as possible.

  # 关闭 issue 时自动评论
  comment-on-issue-closed:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    if: github.event.action == 'closed'
    steps:
      - name: Comment on closed issue
        uses: actions/github-script@v6
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "The issue is now resolved."
            });

  # 首次提交 PR 时祝贺用户
  congratulate-first-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check if first PR
        uses: actions/github-script@v6
        id: check-first-pr
        with:
          script: |
            // 获取当前用户的所有 PR 列表
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              creator: github.event.pull_request.user.login
            });
            // 如果 PR 数量为 1，说明是首次提交
            return prs.data.length === 1;

      - name: Congratulate on first PR
        if: steps.check-first-pr.outputs.result == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "🎉 Congratulations on your first pull request!"
            });
